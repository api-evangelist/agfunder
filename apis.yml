aid: agfunder
name: AgFunder
description: >-
  AgFunder is a global agrifood-tech venture capital firm investing in deeptech
  and foundational technologies across AI, biology, robotics, and climate to
  advance food, agriculture, and human and planetary health. Founded roughly a
  decade ago by Michael Dean and Rob Leclerc and headquartered in Silicon Valley
  with offices in London and Singapore, the firm manages over $300M in assets and
  has backed more than 100 portfolio companies across four continents. AgFunder
  also operates AgFunderNews (AFN), the leading agtech and foodtech news and
  research publication, and publishes market research for the agrifoodtech
  ecosystem. This profile was added to the API Evangelist network as a
  portfolio-company lead and enriched with the firm's public identity and site
  properties; AgFunder publishes no public developer API surface.
